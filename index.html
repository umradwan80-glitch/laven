    <script>
      // Apply saved theme before first paint to avoid flash of wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('laven-theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
